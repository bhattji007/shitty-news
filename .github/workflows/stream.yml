name: stream image

# Builds and pushes the stream/ Docker image to GHCR. Only runs when the
# repository variable STREAM_ENABLED is "true". Deployment target is yours to configure.
on:
  push:
    branches: [main]
    paths: ['stream/**', 'src/lib/news/**', '.github/workflows/stream.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: ${{ vars.STREAM_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: stream/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-stream:latest
